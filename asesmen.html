/* =============================================================================
   Asesmen Go/No-Go (Mining Bureau) — dashboard, arsip, dan Kelola.
   Lapisan tampilan dalam bahasa desain Apple (dokumentasi §23): terang,
   ramp tipografi macOS, panel isi solid berbayangan tipis, kaca hanya pada
   bilah atas tersemat dan lapisan melayang (modal, toast).
   Data: fungsi SQL gng_* dengan sesi login shell (localStorage pakal_auth).
   ============================================================================= */
:root{
  --t900:#001f1f;--t800:#00302f;--t700:#003c3c;--t600:#0a5a56;
  --amber:#ea9000;--amber-dk:#996000;
  --bg:#eef3f2;--surface:#fff;--surface-2:#f4f8f7;--border:#d9e3e2;--border-soft:#e7eeed;
  --text:#0b1c1c;--text-muted:#47595a;
  --good:#0f6b46;--warn:#8a5600;--bad:#a01c14;--good-soft:#e4f2ea;--warn-soft:#fbeed6;--bad-soft:#fbe6e4;--netral:#eaf0ed;
  --isi:#0000000d;
  --shadow:0 1px 2px rgba(0,48,47,.07),0 0 0 1px rgba(0,60,60,.07);
  --f-large:26px;--f-t2:17px;--f-t3:15px;--f-body:13px;--f-callout:12px;--f-sub:11px;
  --r-panel:14px;--r-inner:10px;--h-kontrol:28px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--font);font-size:var(--f-body);line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px 48px}
.kaca{backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7)}

/* Tempel dari Excel: baris dipisah tab (salinan sel Excel), titik koma, atau koma. */
function bacaTempel(txt){ return txt.split(/\r?\n/).map(function(l){ return l.split(/\t|;/).map(function(x){return x.trim();}); }).filter(function(c){ return c.join('').length; }); }
/* Sama dengan gng__npp() di SQL: huruf & angka saja, huruf besar, tanpa nol di depan untuk NPP angka. */
function kunciNpp(v){ var x=String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,''); return /^[0-9]+$/.test(x)?(x.replace(/^0+/,'')||'0'):x; }
function imporAkun(){

  function baca(){ var ada={}, n=0; var out=[], salah=[]; bacaTempel(el('fi-t').value).forEach(function(c,i){ var npp=(c[0]||'').toUpperCase(); if(/^npp$|operator_id|badge/i.test(npp)) return;
      if(!npp.replace(/[^A-Z0-9]/g,'')||npp.length>30){ salah.push('baris '+(i+1)+': NPP "'+c[0]+'"'); return; } if((c[1]||'').length<3){ salah.push('baris '+(i+1)+': nama kosong'); return; } var kn=kunciNpp(npp); if(ada[kn]){ salah.push('baris '+(i+1)+': NPP ganda'); return; } ada[kn]=1;

    var lama={}; S.k.data.akun.forEach(function(a){lama[kunciNpp(a.npp)]=1;}); var baru=out.filter(function(x){return !lama[kunciNpp(x.npp)];}).length;
    return {out:out,salah:salah,baru:baru,ubah:out.length-baru}; }

  el('fi-t').addEventListener('input',function(){ var r=baca(); el('fi-i').innerHTML=(r.out.length+r.salah.length)?'<b>'+r.baru+'</b> baru · <b>'+r.ubah+'</b> diperbarui · <b>'+r.salah.length+'</b> dilewati'+(r.salah.length?' ('+esc(r.salah[0])+')':''):'Belum ada baris.'; });

   CADANGAN (admin) — salin jawaban + foto ke folder OneDrive di PC ini
   (Chrome/Edge: File System Access API) atau ke satu berkas ZIP. Admin lalu
   menandai selesai: cadangan dicatat (gng_cadangan_catat) dan foto yang sudah
   dicadangkan & berumur > 1 hari dihapus dari Storage. Jawaban tetap di MiningMalut.
   Struktur folder: Cek Aman Go-No-Go / YYYY-MM / YYYY-MM-DD / <No form> <unit> <GO|NO-GO> /
     <No form>.html (form lengkap, bisa dibuka & dicetak) + "08 TIDAK.jpg", "09 YA.jpg", …
   dan Cek Aman Go-No-Go / Rekap / Rekap_<dari>_sd_<sampai>.xlsx
   ============================================================================= */
var AKAR='Cek Aman Go-No-Go';
var BISA_FOLDER=typeof window.showDirectoryPicker==='function';
var CAD={tahap:'siap',cara:null,pesan:'',sudah:0,total:0,hasil:null,folderLama:undefined};
function amanNama(x){ return String(x==null?'':x).replace(/[\\/:*?"<>|\u0000-\u001f]/g,'-').replace(/\s+/g,' ').trim().slice(0,90)||'-'; }
function folderForm(f){ return amanNama(f.no+' '+f.unit+' '+(f.status==='go'?'GO':f.status==='nogo'?'NO-GO':'MENUNGGU')); }
function namaFoto(q,j,i){ return p2(q.no)+' '+(j==='T'?'TIDAK':'YA')+(i?' ('+(i+1)+')':'')+'.jpg'; }
function ukuran(b){ b=+b||0; return b>=1073741824?(b/1073741824).toFixed(2).replace('.',',')+' GB':b>=1048576?Math.round(b/1048576)+' MB':b>0?Math.max(1,Math.round(b/1024))+' KB':'0 MB'; }
function angka(n){ return (+n||0).toLocaleString('id-ID'); }
function tglWit(v){ return tglPanjang(String(new Date(Date.parse(v)+9*3600e3).toISOString()).slice(0,10)); }
async function muatCadangan(){ try{ S.cad=await rpc('gng_cadangan_status'); S.cadWaktu=Date.now(); }catch(e){} }
/* Dua mode. Google Drive terpasang (Apps Script melapor): yang dipantau apakah ia masih jalan,
   Drive-nya penuh atau tidak, dan kapan bulan tertua perlu dipindah ke OneDrive (±3 bulan).
   Belum terpasang: pengingat cadangan manual (hari & penyimpanan). */
function infoDrive(){
  var c=S.cad, d=c&&c.drive; if(!d||!d.aktif) return null;
  var jamOk=d.terakhir_ok?(Date.now()-Date.parse(d.terakhir_ok))/3600e3:1e9;
  var persen=d.kuota?d.terpakai/d.kuota*100:0, gagalTerakhir=!!d.pesan;
  var hariPindah=0; if(d.bulan_tertua&&d.bulan_tertua<hariIni().slice(0,7)){ var a=d.bulan_tertua.split('-'); hariPindah=Math.floor((Date.now()+9*3600e3-Date.UTC(+a[0],+a[1]-1,1))/864e5); }
  return {jamOk:jamOk,persen:persen,gagal:gagalTerakhir,hariPindah:hariPindah};
}
function levelCadangan(){
  var c=S.cad; if(!c) return null; var A=c.aturan, pakai=c.storage_total!=null?c.storage_total:c.foto_tersimpan, persen=pakai/c.storage_batas*100;
  var D=infoDrive(), lv=null, jenis=null;
  if(D){
    if(D.jamOk>A.drive_jam_merah){ lv='merah'; jenis='mati'; }
    else if(persen>=A.persen_merah){ lv='merah'; jenis='penuh'; }
    else if(D.persen>=A.drive_persen_merah){ lv='merah'; jenis='drive'; }
    else if(D.gagal){ lv='kuning'; jenis='gagal'; }
    else if(D.persen>=A.drive_persen_kuning){ lv='kuning'; jenis='drive'; }
    else if(D.hariPindah>=A.drive_hari_pindah){ lv='kuning'; jenis='pindah'; }
    else if(persen>=A.persen_kuning){ lv='kuning'; jenis='penuh'; }
  } else {
    var perlu=c.tertunda.form>0||c.siap_dihapus>0;
    if(persen>=A.persen_merah||(perlu&&c.hari>=A.hari_merah)) lv='merah'; else if(persen>=A.persen_kuning||(perlu&&c.hari>=A.hari_kuning)) lv='kuning';
    jenis=lv?(persen>=A.persen_kuning?'penuh':'manual'):null;
  }
  return {lv:lv,jenis:jenis,persen:persen,pakai:pakai,drive:D};
}
function lamaJam(j){ return j<1?'kurang dari 1 jam':j<48?Math.round(j)+' jam':Math.round(j/24)+' hari'; }
function namaBulan(ym){ var a=ym.split('-'); return ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][+a[1]-1]+' '+a[0]; }
function teksTerakhir(c){ return c.terakhir?'<b>'+(c.hari===0?'hari ini':c.hari+' hari lalu')+'</b> ('+tglWit(c.terakhir.tanggal)+', '+esc(c.terakhir.oleh)+')':'<b>belum pernah</b>'; }
function kartuPengingat(){

  else if(L.jenis==='drive'){ judul='Google Drive Biro Mining '+(merah?'hampir penuh':'mulai penuh'); p='Terpakai <b>'+Math.round(L.drive.persen)+'%</b> ('+ukuran(d.terpakai)+' dari '+ukuran(d.kuota)+'). Pindahkan bulan-bulan lama ke OneDrive kantor, lalu tandai di Kelola → Cadangan.'; tombol='Pindahkan ke OneDrive'; }

  var dr=L.drive&&(L.jenis==='drive'||L.jenis==='pindah');

  return '<div class="ingat lv-'+L.lv+'" role="alert"><div class="ic">'+IC.awan+'</div><div><h2>'+judul+'</h2><p>'+p+'</p>'+meter+'</div><div><button class="btn besar" data-ke-cadangan="1">'+IC.awan+tombol+'</button></div></div>';

/* folder terakhir diingat di HP/PC ini (IndexedDB), supaya tidak perlu memilih ulang */
function idbFolder(simpan,val){ return new Promise(function(res){ try{ var o=indexedDB.open('gng-cadangan',1); o.onupgradeneeded=function(){ o.result.createObjectStore('kv'); };
  o.onsuccess=function(){ try{ var tx=o.result.transaction('kv',simpan?'readwrite':'readonly'), st=tx.objectStore('kv'); var r=simpan?st.put(val,'folder'):st.get('folder'); r.onsuccess=function(){ res(simpan?true:(r.result||null)); }; r.onerror=function(){ res(null); }; }catch(e){ res(null); } };
  o.onerror=function(){ res(null); }; }catch(e){ res(null); } }); }

async function tautanFoto(paths){ // foto penuh, bertanda tangan 1 jam, 100 per permintaan
  var out={}, tk=token();
  for(var i=0;i<paths.length;i+=100){ var r=await fetch(SUPA.url+'/storage/v1/object/sign/'+BUCKET,{method:'POST',headers:{apikey:SUPA.key,Authorization:'Bearer '+tk,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:3600,paths:paths.slice(i,i+100)})});
    if(r.status===401) throw galat('Sesi login berakhir. Keluar lalu masuk lagi.','sesi'); var arr=r.ok?await r.json():[]; (arr||[]).forEach(function(x){ if(x&&x.signedURL&&x.path) out[x.path]=SUPA.url+'/storage/v1'+x.signedURL; }); }
  return out;
}
async function salinCadangan(tulis){
  var batas=new Date().toISOString(), forms=[];
  CAD.pesan='Mengambil daftar form…'; segarProgres();
  for(var off=0;;off+=200){ var isi=await rpc('gng_cadangan_ambil',{p_batas:batas,p_limit:200,p_offset:off}); forms=forms.concat(isi); if(isi.length<200) break; }
  if(!forms.length) throw new Error('Tidak ada form baru untuk dicadangkan.');
  var tugas=[]; forms.forEach(function(f){ var jl=[AKAR,f.tanggal.slice(0,7),f.tanggal,folderForm(f)];
    f.pertanyaan.forEach(function(q){ var j=f.jawaban[q.id]; ((f.evidence[q.id]||{}).foto||[]).forEach(function(p,i){ tugas.push({f:f,q:q,j:j,i:i,p:p,jalur:jl,nama:namaFoto(q,j,i)}); }); }); });
  CAD.pesan='Menyiapkan '+angka(tugas.length)+' foto…'; segarProgres();
  var url=await tautanFoto(tugas.map(function(t){return t.p;})), bytes=0, hilang={}, nHilang=0, idx=0;
  CAD.sudah=0; CAD.total=tugas.length+forms.length+1;
  async function pekerja(){ while(idx<tugas.length){ var t=tugas[idx++], buf=null;
    if(url[t.p]){ for(var c=0;c<3&&!buf;c++){ try{ var r=await fetch(url[t.p]); if(r.ok) buf=new Uint8Array(await r.arrayBuffer()); else if(r.status===404||r.status===400) break; }catch(e){} } }
    if(buf){ await tulis(t.jalur,t.nama,buf); bytes+=buf.length; } else { nHilang++; (hilang[t.f.id]=hilang[t.f.id]||[]).push(t); }
    CAD.sudah++; CAD.pesan='Menyalin foto '+angka(Math.min(CAD.sudah,tugas.length))+' dari '+angka(tugas.length)+'…'; segarProgres(); } }
  await Promise.all([pekerja(),pekerja(),pekerja(),pekerja()]);
  CAD.pesan='Menyimpan halaman form…'; segarProgres();
  for(var k=0;k<forms.length;k++){ var f=forms[k], jl=[AKAR,f.tanggal.slice(0,7),f.tanggal,folderForm(f)], hl=hilang[f.id]||[];
    await tulis(jl,amanNama(f.no)+'.html',htmlForm(f,function(p,q,j,i){ return hl.some(function(t){return t.p===p;})?null:namaFoto(q,j,i); },false));
    if(hl.length) await tulis(jl,'FOTO-TIDAK-DITEMUKAN.txt',hl.map(function(t){ return 'No. '+t.q.no+' ('+(t.j==='T'?'TIDAK':'YA')+'): '+t.p; }).join('\r\n'));
    CAD.sudah++; segarProgres(); }
  var dari=forms.reduce(function(a,f){return f.tanggal<a?f.tanggal:a;},forms[0].tanggal), sampai=forms.reduce(function(a,f){return f.tanggal>a?f.tanggal:a;},forms[0].tanggal);
  CAD.pesan='Menyusun Rekap Excel…'; segarProgres();
  var X=lembarExcel(forms,[['Cadangan',tglPanjang(hariIni())+' '+jam(new Date().toISOString())+' WIT oleh '+((S.saya&&S.saya.email)||'')],['Tanggal form',tglPanjang(dari)+' – '+tglPanjang(sampai)],['Jumlah form',String(forms.length)],
    ['Foto','Kolom Foto berisi lokasi berkas foto di folder cadangan ini, relatif terhadap folder "'+AKAR+'". Tiap form juga punya halaman HTML yang bisa dibuka dan dicetak.']],
    function(f,q,j,fl){ return fl.map(function(p,i){ return [f.tanggal.slice(0,7),f.tanggal,folderForm(f),namaFoto(q,j,i)].join('/'); }).join(' ; '); });
  await tulis([AKAR,'Rekap'],'Rekap_'+dari+'_sd_'+sampai+'_dibuat_'+hariIni()+'_'+jam(new Date().toISOString()).replace('.','')+'.xlsx',await bikinXlsx(X.lembar));
  CAD.sudah=CAD.total; segarProgres();
  return {ids:forms.map(function(f){return f.id;}),form:forms.length,foto:tugas.length-nHilang,hilang:nHilang,bytes:bytes,dari:dari,sampai:sampai};
}
function penulisFolder(akar){
  var cache={}, lewati=akar.name===AKAR?1:0;
  function dir(jalur){ var j=jalur.slice(lewati), key=j.join('/'); if(!j.length) return Promise.resolve(akar); if(cache[key]) return cache[key];
    cache[key]=dir(jalur.slice(0,jalur.length-1)).then(function(d){ return d.getDirectoryHandle(j[j.length-1],{create:true}); }); return cache[key]; }
  return async function(jalur,nama,isi){ var d=await dir(jalur), fh=await d.getFileHandle(nama,{create:true}), w=await fh.createWritable(); await w.write(isi); await w.close(); };
}
function zipBlob(entri){ // simpan tanpa kompresi (foto JPEG sudah padat); nama UTF-8
  var enc=new TextEncoder(), parts=[], pusat=[], off=0, t=wit(); var dt=((t.h&31)<<11)|((t.mi&63)<<5), dd=((t.y-1980)<<9)|((t.m+1)<<5)|t.d;
  entri.forEach(function(e){ var nm=enc.encode(e.nama), d=typeof e.isi==='string'?enc.encode(e.isi):e.isi, c=crc32(d);
    var h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint16(10,dt,true); h.setUint16(12,dd,true); h.setUint32(14,c,true); h.setUint32(18,d.length,true); h.setUint32(22,d.length,true); h.setUint16(26,nm.length,true); h.setUint16(28,0,true);
    parts.push(h.buffer,nm,d);
    var z=new DataView(new ArrayBuffer(46)); z.setUint32(0,0x02014b50,true); z.setUint16(4,20,true); z.setUint16(6,20,true); z.setUint16(8,0x0800,true); z.setUint16(10,0,true); z.setUint16(12,dt,true); z.setUint16(14,dd,true); z.setUint32(16,c,true); z.setUint32(20,d.length,true); z.setUint32(24,d.length,true); z.setUint16(28,nm.length,true); z.setUint32(42,off,true);
    pusat.push(z.buffer,nm); off+=30+nm.length+d.length; });
  var uk=pusat.reduce(function(a,b){return a+b.byteLength;},0), end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,entri.length,true); end.setUint16(10,entri.length,true); end.setUint32(12,uk,true); end.setUint32(16,off,true);
  return new Blob(parts.concat(pusat,[end.buffer]),{type:'application/zip'});
}
async function mulaiCadangan(cara,handle){
  if(CAD.tahap==='jalan'||CAD.tahap==='hapus') return;
  CAD.tahap='jalan'; CAD.cara=cara; CAD.sudah=0; CAD.total=0; CAD.hasil=null; CAD.pesan='Mulai…'; renderKelola();
  var entri=[], tulis=cara==='folder'?penulisFolder(handle):async function(jalur,nama,isi){ entri.push({nama:jalur.join('/')+'/'+nama,isi:isi}); };
  try{
    var h=await salinCadangan(tulis);
    if(cara==='zip'){ CAD.pesan='Menyusun berkas ZIP…'; segarProgres(); var nama=AKAR+' '+h.dari+' sd '+h.sampai+'.zip'; unduhBlob(zipBlob(entri),nama); h.folder=nama; }
    else h.folder=handle.name===AKAR?AKAR:handle.name+' / '+AKAR;
    CAD.hasil=h; CAD.tahap='hasil';
  }catch(e){ CAD.tahap='gagal'; CAD.pesan=(e&&e.name==='NotAllowedError')?'Browser tidak diberi izin menulis ke folder itu. Coba lagi dan pilih Izinkan / Allow.':(e.message||String(e)); }
  entri=null; renderKelola();
}
async function pilihFolder(lama){
  var h=null;
  try{
    if(lama&&CAD.folderLama){ var izin=await CAD.folderLama.requestPermission({mode:'readwrite'}); if(izin==='granted') h=CAD.folderLama; }
    if(!h){ h=await window.showDirectoryPicker({id:'gng-cadangan',mode:'readwrite',startIn:'documents'}); await idbFolder(true,h); CAD.folderLama=h; }
  }catch(e){ if(e&&e.name==='AbortError') return; toast('Folder tidak bisa dibuka: '+esc(e.message||e),true); return; }
  return mulaiCadangan('folder',h);
}
async function hapusFotoLama(){
  var n=0, putaran=0;
  for(;;){ if(++putaran>500) break;
    var r=await rpc('gng_foto_hapus_daftar',{p_form:20}); if(!r.form.length) break;
    var terhapus=0;
    for(var i=0;i<r.paths.length;i+=500){ var res=await fetch(SUPA.url+'/storage/v1/object/'+BUCKET,{method:'DELETE',headers:{apikey:SUPA.key,Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:JSON.stringify({prefixes:r.paths.slice(i,i+500)})});
      if(!res.ok) throw new Error('Foto lama gagal dihapus (server menjawab '+res.status+').'); var arr=await res.json().catch(function(){return [];}); terhapus+=(arr||[]).length; }
    if(!terhapus){ var cek=await tautanFoto([r.paths[0]]); if(cek[r.paths[0]]) throw new Error('Foto lama tidak bisa dihapus: akun ini belum diberi izin. Pastikan 02_fungsi.sql terbaru sudah dijalankan di Supabase.'); }
    var m=await rpc('gng_foto_tandai_dihapus',{p_ids:r.form}); n+=r.form.length; CAD.pesan='Menghapus foto lama dari MiningMalut: '+angka(n)+' form…'; segarProgres(); if(!m) break; }
  return n;
}
async function tandaiSelesai(){
  var h=CAD.hasil; if(!h) return; CAD.tahap='hapus'; CAD.sudah=0; CAD.total=0; CAD.pesan='Mencatat cadangan…'; renderKelola();
  var tercatat=false;
  try{ await rpc('gng_cadangan_catat',{p:{cara:CAD.cara,folder:h.folder,ids:h.ids,jumlah_foto:h.foto,bytes:h.bytes}}); tercatat=true;
    var n=await hapusFotoLama(); CAD.tahap='beres'; CAD.pesan=angka(h.form)+' form tercatat sudah dicadangkan'+(n?'. Foto '+angka(n)+' form lama dihapus dari MiningMalut.':'. Foto hari ini dan kemarin tetap disimpan dulu; ikut dihapus pada cadangan berikutnya.'); }
  catch(e){ CAD.tahap='gagal'; CAD.pesan=(tercatat?'Cadangan sudah tercatat, tetapi foto lama belum terhapus: ':'')+e.message; }
  CAD.hasil=null; await muatCadangan(); renderKelola();
}
async function hapusSaja(){ CAD.tahap='hapus'; CAD.pesan='Menghapus foto lama…'; renderKelola();
  try{ var n=await hapusFotoLama(); CAD.tahap='beres'; CAD.pesan='Foto '+angka(n)+' form lama dihapus dari MiningMalut.'; }catch(e){ CAD.tahap='gagal'; CAD.pesan=e.message; }
  await muatCadangan(); renderKelola(); }

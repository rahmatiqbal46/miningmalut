<style>
/* =============================================================================
   Cek Aman Sebelum Bekerja (Go/No-Go) — aplikasi HP operator dan pengawas.
   Lapisan tampilan dalam bahasa desain Apple (dokumentasi §23):
   - kaca HANYA di bilah atas, bilah tab/aksi bawah, dan sheet; isi solid
   - ramp tipografi iOS (Large Title 34/41 … Caption 12/16)
   - palet MiningMalut: teal #003c3c, amber #ea9000 (tidak untuk teks di latar terang)
   - tombol jawaban & aksi ≥ 52 px untuk dipakai dengan sarung tangan
   ============================================================================= */
:root{
  --t900:#001f1f;--t800:#00302f;--t700:#003c3c;--t600:#0a5a56;
  --amber:#ea9000;--amber-dk:#996000;
  --bg:#f2f5f4;--panel:#fff;--ink:#0b1c1c;--muted:#47595a;--line:#d9e3e2;--line2:#c4d2d1;
  --hijau:#0f6b46;--oranye:#8a5600;--merah:#a01c14;
  --hijau-bg:#e4f2ea;--oranye-bg:#fbeed6;--merah-bg:#fbe6e4;--netral-bg:#eaf0ed;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --r-panel:14px;--r-inner:10px;
  --sa-t:env(safe-area-inset-top,0px);--sa-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:17px;line-height:22px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;position:relative;min-height:100dvh}
.scr{padding:calc(var(--sa-t) + 64px) 16px calc(var(--sa-b) + 120px)}
.scr.tanpa-nav{padding-top:calc(var(--sa-t) + 24px)}
.kaca{backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7)}

/* bilah atas */
.nav{position:fixed;top:0;left:0;right:0;max-width:560px;margin:0 auto;z-index:20;padding:calc(var(--sa-t) + 8px) 16px 8px;
  background:linear-gradient(180deg,rgba(242,245,244,.88),rgba(242,245,244,.76));box-shadow:inset 0 -1px 0 rgba(11,28,28,.08)}
.nav-row{display:flex;align-items:center;justify-content:space-between;min-height:40px;gap:8px}
.nav-row .t{font-size:17px;line-height:22px;font-weight:650;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-btn{border:0;background:transparent;color:var(--t600);font-size:17px;padding:8px 2px;min-width:72px;min-height:44px;text-align:left;display:flex;align-items:center;gap:2px}
.nav-btn.r{justify-content:flex-end;text-align:right}
.nav-btn svg{width:22px;height:22px}
.prog{height:4px;border-radius:4px;background:rgba(11,28,28,.08);overflow:hidden;margin-top:6px}
.prog b{display:block;height:100%;background:var(--t600);border-radius:4px;transition:width .25s}
.prog-t{font-size:13px;line-height:18px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:8px}

.lt{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.2px;margin:0 0 4px}
.lt-sub{font-size:15px;line-height:20px;color:var(--muted);margin:0 0 18px}

/* bilah bawah (kaca) */
.gbar{position:fixed;left:0;right:0;max-width:540px;margin:0 auto;bottom:calc(var(--sa-b) + 10px);z-index:20;border-radius:34px;padding:10px;width:calc(100% - 20px);
  background:linear-gradient(176deg,rgba(255,255,255,.74),rgba(245,249,248,.84));
  box-shadow:0 12px 34px rgba(0,30,30,.18),inset 0 1px 1px rgba(255,255,255,.9),inset 0 -8px 20px rgba(255,255,255,.25),inset 0 0 0 1px rgba(11,28,28,.08)}
.tabbar{display:flex;gap:4px;padding:6px}
.tab{flex:1;border:0;background:transparent;border-radius:26px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);min-height:54px}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{background:rgba(0,60,60,.09);color:var(--t700)}
.abar-sum{font-size:13px;line-height:18px;color:var(--muted);text-align:center;padding:2px 8px 8px}
.abar-sum b{color:var(--ink)}

.bigbtn{border:0;width:100%;min-height:54px;border-radius:27px;font-size:17px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;transition:transform .12s,opacity .15s}
.bigbtn:active{transform:scale(.98)}
.bigbtn.pri{background:var(--t700);color:#fff}
.bigbtn.go{background:var(--hijau);color:#fff}
.bigbtn.nogo{background:var(--merah);color:#fff}
.bigbtn.sec{background:rgba(11,28,28,.07);color:var(--ink)}
.bigbtn[disabled]{opacity:.38;cursor:not-allowed;transform:none}
.bigbtn svg{width:20px;height:20px}
.stack{display:grid;gap:10px}

/* isi (solid) */
.hdr{font-size:15px;line-height:20px;font-weight:650;margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hdr span{font-weight:400;color:var(--muted);font-size:13px}
.inset{background:var(--panel);border-radius:var(--r-panel);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:50px;position:relative;font-size:17px;line-height:22px}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.row .k{color:var(--muted);flex:0 0 auto}
.row .v{margin-left:auto;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.tap{width:100%;border:0;background:transparent;text-align:left;min-height:62px}
.row.tap:active{background:rgba(11,28,28,.04)}
.row .chev{width:16px;height:16px;color:var(--line2);flex:0 0 auto}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main small{display:block;font-size:13px;line-height:18px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.auto{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:3px}
.auto svg{width:12px;height:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;line-height:16px;font-weight:650;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.go{background:var(--hijau-bg);color:var(--hijau)}
.pill.nogo{background:var(--merah-bg);color:var(--merah)}
.pill.wait{background:var(--oranye-bg);color:var(--oranye)}
.pill.na,.pill.antre{background:var(--netral-bg);color:var(--muted)}
.pill.na::before{display:none}
.status{border-radius:var(--r-panel);padding:16px;background:var(--panel)}
.status h3{margin:8px 0 4px;font-size:22px;line-height:28px}
.status p{margin:0;font-size:15px;line-height:20px;color:var(--muted)}
.status.go{background:var(--hijau-bg)}.status.go h3{color:var(--hijau)}
.status.nogo{background:var(--merah-bg)}.status.nogo h3{color:var(--merah)}
.status.wait{background:var(--oranye-bg)}.status.wait h3{color:var(--oranye)}
.status.antre{background:var(--netral-bg)}
.status .catatan{margin-top:12px;background:rgba(255,255,255,.7);border-radius:var(--r-inner);padding:10px 12px;font-size:15px;line-height:20px;color:var(--ink)}
.status .catatan small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{border:0;min-height:52px;border-radius:var(--r-inner);background:var(--panel);font-size:16px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.chip[aria-pressed="true"]{background:var(--t700);color:#fff;box-shadow:none}
.selwrap{position:relative}
.selwrap select{appearance:none;-webkit-appearance:none;width:100%;border:0;background:transparent;font-size:17px;padding:12px 40px 12px 16px;min-height:52px}
.selwrap::after{content:"";position:absolute;right:18px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sellab{font-size:13px;color:var(--muted);padding:10px 16px 0}
.sellab+.selwrap{border-bottom:1px solid var(--line)}
.manual{padding:0 16px 12px}
.manual input,.fld{width:100%;height:50px;border:1px solid var(--line2);border-radius:var(--r-inner);padding:0 12px;font-size:17px;background:#fff}
.manual input:focus,.fld:focus{outline:none;border-color:var(--t600);box-shadow:0 0 0 3px rgba(10,90,86,.15)}
.manual small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.minseg{display:flex;background:rgba(11,28,28,.06);border-radius:12px;padding:3px;gap:3px;margin:4px 16px 8px}
.minseg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:44px;font-size:15px;font-weight:600;color:var(--muted)}
.minseg button[aria-pressed="true"]{background:#fff;color:var(--t700);box-shadow:0 1px 2px rgba(0,0,0,.14)}

    var msg=(j&&(j.message||j.hint))||('Server menjawab '+r.status);

function render(){
  if(!S.sesi){ return renderLogin(); }
  if(S.layar==='gantipin') return renderGantiPin();
  if(S.sesi.peran==='pengawas') return renderPg();
  if(S.layar==='form') return renderForm();

}

async function masuk(){
  var npp=(document.getElementById('in-npp').value||'').trim().toUpperCase(); var pinEl=document.getElementById('in-pin'); var pin=pinEl?pinEl.value.trim():null;
  S.login.npp=npp; if(!npp){ S.login.err='Isi NPP.'; return renderLogin(); }
  S.login.sibuk=true; S.login.err=''; renderLogin();
  try{
    var r=await rpc('gng_masuk',{p_npp:npp,p_pin:pin||null,p_perangkat:navigator.userAgent.slice(0,180)});
    S.login.sibuk=false;
    if(r&&r.galat){ S.login.perluPin=!!r.perlu_pin||S.login.perluPin; S.login.err=(pin||!r.perlu_pin)?r.galat:''; return renderLogin(); }
    S.sesi=r; simpanLS(K_SESI,r); S.ganti.pinLama=pin||''; S.login={npp:'',perluPin:false,err:'',sibuk:false};
    S.layar='home'; S.tab='home'; S.versi=null; S.pg.versi=null; render(); segarkan(true);
  }catch(e){ S.login.sibuk=false; S.login.err=e.jaringan?'Tidak ada sinyal. Masuk butuh sinyal sekali; sesudah itu form bisa diisi tanpa sinyal.':e.message; renderLogin(); }
}

async function gantiPin(){
  var G=S.ganti, lama=G.pinLama||(document.getElementById('pin-lama')||{}).value||'', b=document.getElementById('pin-baru').value.trim(), u=document.getElementById('pin-ulang').value.trim();
  if(!/^\d{4,6}$/.test(b)){ G.err='PIN baru harus 4 sampai 6 angka.'; return renderGantiPin(); }
  if(b!==u){ G.err='Kedua PIN baru tidak sama.'; return renderGantiPin(); }
  G.sibuk=true; G.err=''; renderGantiPin();
  try{ await rpc('gng_ganti_pin',{p_token:S.sesi.token,p_pin_lama:lama,p_pin_baru:b}); S.sesi.pin_awal=false; simpanLS(K_SESI,S.sesi); G.sibuk=false; G.pinLama=''; S.layar='home'; render(); segarkan(true); toast('PIN tersimpan. Gunakan PIN ini saat masuk berikutnya.'); }
  catch(e){ G.sibuk=false; G.err=e.jaringan?'Tidak ada sinyal. Coba lagi.':e.message; if(/PIN sekarang salah/.test(G.err)) G.pinLama=''; if(S.sesi) renderGantiPin(); }
}
async function keluar(){ var t=S.sesi&&S.sesi.token; try{ if(t) await rpc('gng_keluar',{p_token:t}); }catch(e){} S.riwayat=[]; try{ localStorage.removeItem(K_RIWAYAT); }catch(e){} keluarLokal(''); }

function antreanSaya(){ var n=S.sesi&&S.sesi.npp; return S.antrean.filter(function(a){return a.npp===n;}); }
function daftarSaya(){
  var q=antreanSaya().map(function(a){ return {id:a.id,no:null,tanggal:a.form.tanggal,shift:a.form.shift,diisi:a.form.diisi,alat:a.form.alat,unit:a.form.unit,lokasi:a.form.lokasi,status:a.galat?'gagal':'antre',galat:a.galat,jumlah_tidak:a.jumlah_tidak}; });
  var ids={}; q.forEach(function(x){ids[x.id]=1;});
  return q.concat((S.riwayat||[]).filter(function(x){return !ids[x.id];})).sort(function(a,b){ return Date.parse(b.diisi)-Date.parse(a.diisi); });
}

function unitUntuk(alat){ return (S.master&&S.master.unit||[]).filter(function(u){return u.alat===alat;}); }
function berlaku(q,alat,shift){ if(q.alat&&q.alat.length&&q.alat.indexOf(alat)<0) return false; if(q.shift&&q.shift!==shift) return false; return true; }
function qAktif(d){ return d.alat?(S.master.pertanyaan||[]).filter(function(q){return berlaku(q,d.alat,d.shift);}):[]; }
function qById(id){ var a=S.master.pertanyaan||[]; for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }
function draftBaru(){
  var ts=Date.now(), sh=tentukanShift(ts); var last=daftarSaya()[0];
  var d={id:uuid(),npp:S.sesi.npp,ts:ts,shift:sh.shift,tgl:sh.tgl,alt:sh.alt,alat:null,unit:'',unitManual:'',lokasi:'',lokManual:'',jawaban:{},evidence:{},simpan:ts};
  var alat=last?last.alat:(S.sesi.alat_bawaan||null); if(alat&&S.master.alat.indexOf(alat)>=0) d.alat=alat;
  if(last&&d.alat===last.alat){ if(unitUntuk(d.alat).some(function(u){return u.nama===last.unit;})) d.unit=last.unit; else { d.unit='__lain'; d.unitManual=last.unit; } }
  if(last){ if((S.master.lokasi||[]).indexOf(last.lokasi)>=0) d.lokasi=last.lokasi; else { d.lokasi='__lain'; d.lokManual=last.lokasi; } }
  return d;
}
var drafTimer=null;
function drafTunda(){ clearTimeout(drafTimer); drafTimer=setTimeout(function(){ if(S.draft){ S.draft.simpan=Date.now(); drafSimpan(S.draft).catch(function(){}); } },400); }
function cekDraft(d){
  var aktif=qAktif(d), jawab=0, kurang=0, tidak=0;
  aktif.forEach(function(q){ var j=d.jawaban[q.id]; if(j) jawab++; if(j==='T'){ tidak++; var e=d.evidence[q.id]; if(!e||!e.ket||e.ket.trim().length<5||!e.foto.length) kurang++; } });
  var unitOk=!!d.unit&&(d.unit!=='__lain'||d.unitManual.trim().length>=2), lokOk=!!d.lokasi&&(d.lokasi!=='__lain'||d.lokManual.trim().length>=2);
  return {total:aktif.length,jawab:jawab,kurang:kurang,tidak:tidak,unitOk:unitOk,lokOk:lokOk,ok:!!(d.alat&&unitOk&&lokOk&&aktif.length&&jawab===aktif.length&&kurang===0)};
}
function qCard(q,d,no){
  var j=d.jawaban[q.id]; var cls=j==='Y'?' ya':j==='T'?' tidak':'';
  var s='<div class="q'+cls+'" id="q-'+q.id+'" data-no="'+no+'"><div class="q-t"><span class="q-n">'+no+'</span><span>'+esc(q.teks)+'</span></div>';
  s+='<div class="yn"><button class="y" data-ans="'+q.id+'|Y" aria-pressed="'+(j==='Y')+'">'+IC.check+'YA</button><button class="n" data-ans="'+q.id+'|T" aria-pressed="'+(j==='T')+'">'+IC.x+'TIDAK</button></div>';
  if(j==='T'){
    var e=d.evidence[q.id]||{ket:'',foto:[]};
    s+='<div class="ev"><label class="l" for="ket-'+q.id+'">Keterangan (wajib)</label><textarea id="ket-'+q.id+'" data-ket="'+q.id+'" placeholder="Apa yang tidak sesuai? Contoh: rotary lamp mati.">'+esc(e.ket)+'</textarea>';
    s+='<label class="l" style="margin-top:10px">Foto (wajib, maks. 3)</label><div class="fotos">';
    e.foto.forEach(function(src,i){ s+='<div class="foto"><img alt="Foto '+(i+1)+'" src="'+src+'"><button class="x" data-rmfoto="'+q.id+'|'+i+'" aria-label="Hapus foto">×</button></div>'; });
    if(e.foto.length<3) s+='<label class="addfoto">'+IC.cam+'Ambil foto<input type="file" accept="image/*" capture="environment" data-foto="'+q.id+'" aria-label="Ambil foto untuk pertanyaan '+no+'"></label>';
    s+='</div></div>';
  }
  return s+'</div>';
}

function abarForm(c){
  var d=S.draft, msg;
  if(!d.alat) msg='Pilih jenis alat untuk mulai.';
  else if(!c.unitOk) msg='Pilih atau tulis <b>no. unit</b>.';
  else if(!c.lokOk) msg='Pilih atau tulis <b>lokasi / front</b>.';
  else if(c.jawab<c.total) msg='Jawab <b>'+(c.total-c.jawab)+'</b> pertanyaan lagi.';
  else if(c.kurang) msg='Lengkapi keterangan dan foto untuk <b>'+c.kurang+'</b> jawaban TIDAK.';
  else if(c.tidak) msg='<b style="color:var(--merah)">'+c.tidak+' jawaban TIDAK.</b> Pengawas akan meninjau.';
  else msg='<b style="color:var(--hijau)">Semua YA.</b> '+(S.sinyal?'Siap dikirim ke pengawas.':'Akan dikirim saat ada sinyal.');
  return '<div class="abar-sum">'+msg+'</div><button class="bigbtn pri" data-aksi="kirim" '+(c.ok?'':'disabled')+'>'+(S.sinyal?'Kirim ke Pengawas':'Simpan, kirim saat ada sinyal')+'</button>';
}

function gantiKartu(id){ var q=qById(id); var el=document.getElementById('q-'+id); if(el&&q) el.outerHTML=qCard(q,S.draft,+el.dataset.no); segarkanBar(); drafTunda(); }
function tetapGulir(fn){ var y=window.scrollY; fn(); window.scrollTo(0,y); }
function perkecil(file,cb){
  var url=URL.createObjectURL(file), img=new Image();
  img.onload=function(){ var s=Math.min(1,1280/Math.max(img.width,img.height)); var c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); var q=.72, d=c.toDataURL('image/jpeg',q); while(d.length>1.3e6&&q>.35){ q-=.1; d=c.toDataURL('image/jpeg',q); } cb(d); };
  img.onerror=function(){ URL.revokeObjectURL(url); toast('Foto tidak bisa dibaca. Coba ambil ulang.',true); };
  img.src=url;
}
async function kirimForm(){
  var d=S.draft, c=cekDraft(d); if(!c.ok) return;
  var no=0, qs=[]; ['A','B','C','D','E'].forEach(function(sk){ (S.master.pertanyaan||[]).filter(function(q){return q.bagian===sk&&berlaku(q,d.alat,d.shift);}).forEach(function(q){ no++; qs.push({id:q.id,no:no,bagian:q.bagian,teks:q.teks,ringkas:q.ringkas}); }); });
  var jaw={}, ev={}, foto={}; qs.forEach(function(q){ jaw[q.id]=d.jawaban[q.id]; if(jaw[q.id]==='T'){ ev[q.id]={ket:d.evidence[q.id].ket.trim()}; foto[q.id]=d.evidence[q.id].foto.map(function(x){return {data:x,path:null};}); } });
  var it={id:d.id,npp:S.sesi.npp,dibuat:Date.now(),jumlah_tidak:c.tidak,foto:foto,
    form:{id:d.id,diisi:new Date(d.ts).toISOString(),tanggal:d.tgl,shift:d.shift,alat:d.alat,
      unit:d.unit==='__lain'?d.unitManual.trim():d.unit, lokasi:d.lokasi==='__lain'?d.lokManual.trim():d.lokasi,
      pertanyaan:qs,jawaban:jaw,evidence:ev}};
  await antreanSimpan(it); S.antrean.push(it); S.draft=null; await drafSimpan(null); S.terkirim=it.id; S.layar='done'; render(); window.scrollTo(0,0);
  prosesAntrean(true);
}
async function prosesAntrean(tampil){
  if(S.kirimJalan||!S.sesi||S.sesi.peran!=='operator') return; S.kirimJalan=true;
  try{
    var list=antreanSaya().filter(function(a){return !a.galat;});
    for(var i=0;i<list.length;i++){
      var it=list[i];
      try{
        var keys=Object.keys(it.foto||{});
        for(var k=0;k<keys.length;k++){ var arr=it.foto[keys[k]];
          for(var m=0;m<arr.length;m++){ if(arr[m].path) continue;
            try{ var r=await edge({aksi:'unggah',token:S.sesi.token,form_id:it.id,data:arr[m].data}); arr[m].path=r.path; await antreanSimpan(it); }
            catch(e){ if(e.status===409) break; throw e; } } }
        var f=JSON.parse(JSON.stringify(it.form)); Object.keys(f.evidence).forEach(function(q){ f.evidence[q].foto=(it.foto[q]||[]).map(function(x){return x.path;}).filter(Boolean); });
        var hasil=await rpc('gng_kirim',{p_token:S.sesi.token,p_form:f});
        await antreanHapus(it.id); S.antrean=S.antrean.filter(function(a){return a.id!==it.id;});
        S.riwayat=[hasil].concat((S.riwayat||[]).filter(function(x){return x.id!==hasil.id;})).slice(0,15); simpanLS(K_RIWAYAT,S.riwayat);
        S.sinyal=true;
        if(tampil&&S.terkirim===it.id){ /* layar selesai berganti sendiri */ } else toast('Form '+esc(hasil.unit)+' terkirim ke pengawas.');
      }catch(e){
        if(e.jaringan||e.server){ S.sinyal=!e.jaringan; break; }
        if(e.sesi) break;
        it.galat=e.message; await antreanSimpan(it); toast('Form '+esc(it.form.unit)+' ditolak server: '+esc(e.message),true);
      }
    }
  } finally { S.kirimJalan=false; render(); }
}

function renderDone(){
  var it=S.antrean.filter(function(a){return a.id===S.terkirim;})[0]; var terkirim=(S.riwayat||[]).filter(function(x){return x.id===S.terkirim;})[0];
  var antre=!!it&&!it.galat, gagal=it&&it.galat, f=terkirim||(it?it.form:{});
  var t=terkirim?terkirim.jumlah_tidak:(it?it.jumlah_tidak:0);
  var s='<div class="scr tanpa-nav"><div class="done">';
  if(gagal){ s+='<div class="ic" style="background:var(--merah-bg);color:var(--merah)">'+IC.warn+'</div><h2>Form ditolak</h2><p>'+esc(it.galat)+'</p>'; }
  else if(antre){ s+='<div class="ic abu">'+(S.sinyal&&S.kirimJalan?IC.clock:IC.nosig)+'</div><h2>'+(S.kirimJalan?'Mengirim…':'Tersimpan di HP')+'</h2><p>'+(S.kirimJalan?'':'Belum ada sinyal. Form dan foto akan terkirim sendiri begitu sinyal kembali. ')+'Jangan mulai bekerja sampai pengawas memberi <b>GO</b>.</p>'; }
  else { s+='<div class="ic">'+IC.clock+'</div><h2>Terkirim ke pengawas</h2><p>Jangan mulai bekerja sampai pengawas memberi <b>GO</b>. Status akan muncul di Beranda.</p>'; }
  s+='</div>';
  if(!gagal){ s+='<div class="steps"><div class="st '+(antre?'now':'ok')+'"><i>'+(antre?'1':'✓')+'</i>'+(antre?'Menunggu sinyal':'Form '+esc(terkirim&&terkirim.no)+' terkirim')+'</div><div class="st '+(antre?'':'now')+'"><i>2</i>Menunggu keputusan pengawas</div><div class="st"><i>3</i>GO atau NO-GO</div></div>'; }
  s+='<div class="inset"><div class="row"><span class="k">Unit</span><span class="v">'+esc(f.alat)+' · '+esc(f.unit)+'</span></div><div class="row"><span class="k">Jawaban</span><span class="v">'+(t?'<span class="pill nogo">'+t+' TIDAK</span>':'<span class="pill go">Semua YA</span>')+'</span></div></div>';
  s+='<div style="margin-top:18px" class="stack">'+(gagal?'<button class="bigbtn sec" data-hapus-antre="'+it.id+'">Hapus, lalu isi form baru</button>':'')+'<button class="bigbtn sec" data-aksi="tab-home">Kembali ke Beranda</button></div></div>';
  app.innerHTML=s;
}

  var s='<div class="inset">';
  list.forEach(function(f){ var t=f.jumlah_tidak;
    var tag=f.status==='wait'?(t?'<span class="pill nogo">'+t+' TIDAK</span>':'<span class="pill go">Semua YA</span>'):pill(f.status);
    s+='<button class="row tap" data-buka="'+f.id+'"><div class="main"><b>'+esc(f.nama)+'</b><small>'+esc(f.alat)+' '+esc(f.unit)+' · '+esc(f.lokasi)+' · '+(f.status==='wait'?lalu(f.dikirim):jam(f.keputusan_waktu))+'</small></div>'+tag+IC.chev+'</button>'; });

  return '<div class="abar-sum">Semua '+f.pertanyaan.length+' jawaban YA.</div><button class="bigbtn go" data-aksi="dec-go" '+(P.sibuk?'disabled':'')+'>'+IC.check+'GO · Izinkan bekerja</button>';
}
async function bukaForm(id){
  var P=S.pg; P.sel=id; P.form=null; P.catatan=''; P.paksa=false; render(); window.scrollTo(0,0);
  try{
    P.form=await rpc('gng_form',{p_id:id,p_token:S.sesi.token}); render();
    var paths=[]; Object.keys(P.form.evidence||{}).forEach(function(k){ (P.form.evidence[k].foto||[]).forEach(function(p){ if(!P.foto[p]) paths.push(p); }); });
    if(paths.length){ var r=await edge({aksi:'lihat',token:S.sesi.token,paths:paths.slice(0,12)}); (r.urls||[]).forEach(function(x){ P.foto[x.path]=x.url; }); if(P.sel===id) tetapGulir(render); }
  }catch(e){ if(e.sesi) return; toast(e.jaringan?'Tidak ada sinyal. Coba lagi.':esc(e.message),true); if(!P.form){ P.sel=null; render(); } }
}
function lembarKonfirmasi(st){
  var f=S.pg.form; var w=document.createElement('div'); w.className='sheet-wrap';
  w.innerHTML='<div class="sheet kaca" role="dialog" aria-modal="true" aria-label="Konfirmasi keputusan"><h3>'+(st==='go'?'Izinkan '+esc(f.nama.split(' ')[0])+' bekerja?':'Hentikan pekerjaan '+esc(f.unit)+'?')+'</h3><p>Keputusan <b>'+(st==='go'?'GO':'NO-GO')+'</b> dicatat atas nama '+esc(S.sesi.nama)+' (NPP '+esc(S.sesi.npp)+') beserta jamnya, dan menggantikan tanda tangan di form kertas.</p><div class="stack"><button class="bigbtn '+st+'" data-putus="'+st+'">Ya, '+(st==='go'?'GO':'NO-GO')+'</button><button class="bigbtn sec" data-aksi="tutup-sheet">Batal</button></div></div>';
  document.getElementById('lapis').appendChild(w);
}
async function putuskan(st){
  var P=S.pg, f=P.form; document.getElementById('lapis').innerHTML=''; P.sibuk=true; render();
  try{
    var r=await rpc('gng_putuskan',{p_token:S.sesi.token,p_id:f.id,p_keputusan:st,p_catatan:P.catatan||null});
    P.sibuk=false; P.sel=null; P.form=null; P.catatan=''; P.paksa=false; P.versi=null; render(); window.scrollTo(0,0);
    toast((st==='go'?'GO':'NO-GO')+' tercatat untuk '+esc(r.unit)+'. Status di HP operator sudah berubah.'); muatPg();
  }catch(e){ P.sibuk=false; if(e.sesi) return;
    if(/sudah diputuskan/.test(e.message)){ toast(esc(e.message),true); P.sel=null; P.form=null; P.versi=null; render(); muatPg(); }
    else { toast(e.jaringan?'Tidak ada sinyal. Keputusan belum terkirim, coba lagi.':esc(e.message),true); render(); } }
}

var segarJalan=false, segarTerakhir=0;
async function segarkan(paksa){
  if(!S.sesi||segarJalan) return; if(document.visibilityState==='hidden'&&!paksa) return;
  if(S.sesi.peran==='pengawas'){ await muatPg(); return; }
  segarJalan=true;
  try{
    var r=await rpc('gng_operator',{p_token:S.sesi.token,p_versi:paksa?null:S.versi,p_master:S.master?S.master.versi:null});
    S.sinyal=true; segarTerakhir=Date.now();
    if(r&&!r.sama){ S.versi=r.versi; if(r.master){ S.master=r.master; simpanLS(K_MASTER,r.master); } S.riwayat=r.riwayat||[]; simpanLS(K_RIWAYAT,S.riwayat);
      if(r.akun){ S.sesi.nama=r.akun.nama; S.sesi.alat_bawaan=r.akun.alat_bawaan; simpanLS(K_SESI,S.sesi); }
      if(S.layar!=='form') render(); }
  }catch(e){ if(e.jaringan){ S.sinyal=false; if(S.layar!=='form') render(); } }
  finally{ segarJalan=false; }
  if(antreanSaya().some(function(a){return !a.galat;})) prosesAntrean(false);
}
async function muatPg(){
  if(segarJalan) return; segarJalan=true;
  try{ var r=await rpc('gng_pengawas',{p_token:S.sesi.token,p_versi:S.pg.versi}); S.sinyal=true;
    if(r&&!r.sama){ S.pg.data=r; S.pg.versi=r.versi; if(!S.pg.sel&&S.layar!=='gantipin') tetapGulir(render); } }
  catch(e){ if(e.jaringan){ S.sinyal=false; if(!S.pg.sel&&S.layar!=='gantipin') render(); } }
  finally{ segarJalan=false; }
}
function jedaPoll(){
  if(!S.sesi) return 60000;
  if(S.sesi.peran==='pengawas') return 20000;
  var nunggu=daftarSaya().some(function(f){return f.status==='wait'||f.status==='antre';});
  return nunggu?20000:180000;
}
function putaran(){ setTimeout(async function(){ if(document.visibilityState!=='hidden'&&S.layar!=='form'){ await segarkan(false); } putaran(); }, jedaPoll()); }

app.addEventListener('click',function(e){
  var t=e.target;
  if(t.closest('#btn-masuk')) return masuk();
  if(t.closest('#btn-ganti')) return gantiPin();
  var b=t.closest('[data-aksi]');
  if(b){ var a=b.dataset.aksi;
    if(a==='keluar') return keluar();
    if(a==='ganti-pin'){ S.ganti.err=''; S.layar='gantipin'; render(); return; }
    if(a==='batal-pin'){ S.ganti.err=''; S.ganti.pinLama=''; S.layar='home'; render(); return; }
    if(a==='mulai'||a==='tab-form'){ if(S.sesi.peran!=='operator') return; if(!S.master){ toast('Daftar pertanyaan belum termuat. Butuh sinyal sekali.',true); return; }
      (async function(){ var d=await drafBaca().catch(function(){return null;}); if(!S.draft&&d&&d.npp===S.sesi.npp&&Date.now()-d.simpan<2*3600e3){ S.draft=d; toast('Melanjutkan isian yang belum terkirim.'); }
      if(S.draft){ var sk=tentukanShift(Date.now()); if(Date.now()-S.draft.ts>30*60000){ S.draft.ts=Date.now(); S.draft.alt=sk.alt; if(S.draft.shift!==sk.shift||S.draft.tgl!==sk.tgl){ S.draft.shift=sk.shift; S.draft.tgl=sk.tgl; S.draft.jawaban={}; S.draft.evidence={}; } } }
      else S.draft=draftBaru(); S.layar='form'; render(); window.scrollTo(0,0); })(); return; }
    if(a==='tab-home'){ if(S.sesi.peran==='pengawas'){ S.pg.tab='home'; S.pg.sel=null; render(); return; } S.layar='home'; render(); window.scrollTo(0,0); return; }
    if(a==='tab-appr'){ S.pg.tab='appr'; S.pg.filter='wait'; S.pg.sel=null; render(); window.scrollTo(0,0); return; }
    if(a==='batal'){ if(!confirm('Buang isian form ini?')) return; S.draft=null; drafSimpan(null); S.layar='home'; render(); return; }
    if(a==='kirim') return kirimForm();
    if(a==='kembali'){ S.pg.sel=null; S.pg.form=null; render(); return; }
    if(a==='paksa-nogo'){ S.pg.paksa=true; tetapGulir(render); return; }
    if(a==='batal-nogo'){ S.pg.paksa=false; tetapGulir(render); return; }
    if(a==='dec-go') return lembarKonfirmasi('go');
    if(a==='dec-nogo') return lembarKonfirmasi('nogo');
  }
  var h=t.closest('[data-hapus-antre]'); if(h){ var id=h.dataset.hapusAntre; antreanHapus(id); S.antrean=S.antrean.filter(function(x){return x.id!==id;}); S.layar='home'; render(); return; }
  var fl=t.closest('[data-filter]'); if(fl){ S.pg.filter=fl.dataset.filter; render(); return; }
  var bk=t.closest('[data-buka]'); if(bk) return bukaForm(bk.dataset.buka);
  var lb=t.closest('[data-lb]'); if(lb){ var u=S.pg.foto[lb.dataset.lb]; if(u){ var L=document.getElementById('lapis'); L.innerHTML='<div class="lightbox" role="dialog" aria-label="Foto evidence"><img alt="Foto evidence" src="'+esc(u)+'"><button>Tutup</button></div>'; L.firstChild.onclick=function(ev){ if(ev.target.tagName!=='IMG') L.innerHTML=''; }; } return; }
  var d=S.draft; if(!d) return;
  var ps=t.closest('[data-pilihshift]'); if(ps){ var u2=tentukanShift(d.ts); var pick=ps.dataset.pilihshift==='u'?u2:u2.alt; if(pick.shift!==d.shift){ d.shift=pick.shift; d.tgl=pick.tgl; d.jawaban={}; d.evidence={}; } d.tgl=pick.tgl; tetapGulir(render); drafTunda(); return; }
  var al=t.closest('[data-alat]'); if(al){ if(d.alat!==al.dataset.alat){ d.alat=al.dataset.alat; if(d.unit!=='__lain'&&!unitUntuk(d.alat).some(function(u){return u.nama===d.unit;})) d.unit=''; } tetapGulir(render); drafTunda(); return; }
  var an=t.closest('[data-ans]'); if(an){ var p=an.dataset.ans.split('|'), n=+p[0]; d.jawaban[n]=(d.jawaban[n]===p[1])?undefined:p[1]; if(!d.jawaban[n]) delete d.jawaban[n]; if(d.jawaban[n]==='T'&&!d.evidence[n]) d.evidence[n]={ket:'',foto:[]}; gantiKartu(n); return; }
  var rm=t.closest('[data-rmfoto]'); if(rm){ var r2=rm.dataset.rmfoto.split('|'); d.evidence[+r2[0]].foto.splice(+r2[1],1); gantiKartu(+r2[0]); return; }
});
document.getElementById('lapis').addEventListener('click',function(e){
  var p=e.target.closest('[data-putus]'); if(p) return putuskan(p.dataset.putus);
  if(e.target.closest('[data-aksi="tutup-sheet"]')||e.target.classList.contains('sheet-wrap')) document.getElementById('lapis').innerHTML='';
});
app.addEventListener('keydown',function(e){ if(e.key!=='Enter') return; if(e.target.id==='in-npp'||e.target.id==='in-pin') masuk(); if(/^pin-/.test(e.target.id)) gantiPin(); });
app.addEventListener('input',function(e){ var t=e.target, d=S.draft;
  if(t.id==='pg-cat'){ S.pg.catatan=t.value; var ab=document.getElementById('abar'); if(ab) ab.innerHTML=abarPg(); return; }
  if(!d) return;
  if(t.dataset.ket){ d.evidence[+t.dataset.ket].ket=t.value; segarkanBar(); drafTunda(); }
  if(t.dataset.man){ d[t.dataset.man]=t.value; segarkanBar(); drafTunda(); } });
app.addEventListener('change',function(e){ var t=e.target, d=S.draft; if(!d) return;
  if(t.dataset.sel){ d[t.dataset.sel]=t.value; tetapGulir(render); drafTunda(); if(t.value==='__lain'){ var i=document.getElementById(t.dataset.sel==='unit'?'man-unit':'man-lok'); if(i) i.focus(); } return; }
  if(t.dataset.foto&&t.files&&t.files[0]){ var n=+t.dataset.foto; perkecil(t.files[0],function(url){ if(S.draft&&S.draft.evidence[n]){ S.draft.evidence[n].foto.push(url); gantiKartu(n); } }); }
});
window.addEventListener('online',function(){ S.sinyal=true; segarkan(true); });
window.addEventListener('offline',function(){ S.sinyal=false; if(S.layar==='form') segarkanBar(); else render(); });
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') segarkan(false); else if(S.draft){ S.draft.simpan=Date.now(); drafSimpan(S.draft).catch(function(){}); } });
window.addEventListener('pagehide',function(){ if(S.draft){ S.draft.simpan=Date.now(); drafSimpan(S.draft).catch(function(){}); } });

/* ---------- mulai ---------- */
(async function(){
  await bukaDB();
  S.antrean=await antreanSemua().catch(function(){return [];});
  if(S.sesi){ S.layar='home'; render(); segarkan(true); } else { S.layar='login'; render(); }
  putaran();
  if('serviceWorker' in navigator && location.protocol==='https:'){ try{ navigator.serviceWorker.register('sw-cek-aman.js',{scope:'./cek-aman'}); }catch(e){} }
})();
})();
</script>
